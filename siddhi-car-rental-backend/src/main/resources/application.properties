server.port=8080

# ---- MySQL: change username/password to YOUR MySQL login ----
spring.datasource.url=jdbc:mysql://localhost:3306/siddhi_car_rental?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Tables are created by database.sql. "update" also creates any missing table/column
# automatically, so the app still starts if you forgot to run the script.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Kolkata

# ---- Security ----
# Secret used to sign login tokens (any long random text, at least 32 characters)
app.jwt.secret=SiddhiCarRental-Local-Demo-Secret-Key-Change-Me-2025
app.jwt.expiration-minutes=480
# Frontend address(es) allowed to call the API
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Default admin account, created automatically on first start if no admin exists
app.admin.name=Siddhi Admin
app.admin.email=rutikaparekar@gmail.com
app.admin.password=Parekar@123
app.admin.phone=9022893153
